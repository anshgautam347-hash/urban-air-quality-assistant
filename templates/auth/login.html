{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card-custom p-4 shadow-sm">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.5rem;">
                    <i class="bi bi-wind"></i>
                </div>
                <h3 class="fw-bold text-dark">Sign In</h3>
                <p class="text-muted small">Access your saved family profiles and personalized routine settings.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="{{ form.username.id_for_label }}">Username</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="{{ form.password.id_for_label }}">Password</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
            </form>

            <div class="mt-4 pt-3 border-top text-center small text-muted">
                Don't have an account? <a href="{% url 'register' %}" class="text-primary fw-semibold text-decoration-none">Create an Account</a>
                <div class="mt-2">
                    <a href="{% url 'dashboard' %}" class="text-secondary text-decoration-none">&larr; Continue as Guest</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
